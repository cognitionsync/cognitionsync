<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .cs-s {
      transform-origin: 12px 12px;
      transform-box: view-box;
      animation: cs-flip 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes cs-flip {
      0%, 17.5%  { transform: scale(1, 1); }
      25%, 42.5% { transform: scale(-1, 1); }
      50%, 67.5% { transform: scale(-1, -1); }
      75%, 92.5% { transform: scale(-1, -1) rotate(180deg); }
      100%       { transform: scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cs-s { animation: none; }
    }
  </style>
  <path d="M 18.93 8 A 8 8 0 1 0 18.93 16" stroke="#141413" stroke-width="1.5" stroke-linecap="round" opacity="0.9" fill="none"/>
  <path class="cs-s" d="M 14.5 9 C 11 7.2, 7.5 10, 12 12 C 16.5 14, 13 16.8, 9.5 15" stroke="#141413" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="18.93" cy="8" r="1.5" fill="#2563EB"/>
  <circle cx="18.93" cy="16" r="1.5" fill="#2563EB"/>
</svg>
