<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%SITE_THEME_COLOR%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="keywords" content="%SITE_KEYWORDS%" />

    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%SITE_OG_TITLE%" />
    <meta property="og:description" content="%SITE_OG_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SITE_OG_TITLE%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_OG_TITLE%" />
    <meta name="twitter:description" content="%SITE_OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_OG_IMAGE%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "%BRAND_NAME%",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/favicon.svg",
        "image": "%SITE_OG_IMAGE%",
        "description": "%SITE_DESCRIPTION%",
        "email": "%SITE_EMAIL%",
        "sameAs": %SITE_SAMEAS%
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
